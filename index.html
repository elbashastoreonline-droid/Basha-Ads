<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليلك | Daleelak</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        
        /* خلفية الشاشة للكمبيوتر */
        body { background-color: #2c3e50; display: flex; justify-content: center; }

        /* حاوية التطبيق الرئيسية (عشان يظهر بشكل موبايل على الكمبيوتر) */
        #app-container {
            width: 100%;
            max-width: 480px;
            background-color: #f4f7f6;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            padding-bottom: 85px;
            padding-top: 85px;
            overflow-x: hidden;
        }
        
        /* الهيدر الفخم */
        .header { position: fixed; top: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; width: 100%; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; z-index: 1001; }
        .menu-icon { font-size: 28px; cursor: pointer; color: #D4AF37; }
        .header-title { text-align: center; flex-grow: 1; cursor: pointer; } 
        .header-title h1 { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .header-title p { font-size: 13px; color: #D4AF37; font-weight: bold; margin-top: 2px; }
        .spacer { width: 28px; } 

        /* تصميم جملة الترحيب الجديدة */
        .welcome-box { text-align: center; padding: 12px; font-weight: 900; color: #0f2027; background: linear-gradient(90deg, #D4AF37, #F3E5AB); margin: 15px 15px 0 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #c5a017; font-size: 16px; }

        /* شريط الفئة الثابت */
        .sticky-cat { position: fixed; top: 80px; left: 0; right: 0; max-width: 460px; margin: 0 auto; background: linear-gradient(90deg, #D4AF37, #F3E5AB); color: #111; padding: 12px 25px; font-weight: 900; font-size: 15px; z-index: 1000; display: none; align-items: center; justify-content: space-between; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; border: 1px solid #c5a017; transition: 0.3s; }
        .close-cat { background: rgba(0,0,0,0.1); color: #000; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }

      /* شريط التصنيفات (سلايدر) */
.categories-wrapper { padding: 15px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.categories-wrapper::-webkit-scrollbar { display: none; }

/* إظهار شريط تمرير فخم ونحيف جداً لما يفتح من كمبيوتر أو لاب توب */
@media (min-width: 768px) {
    .categories-wrapper { scrollbar-width: thin; scrollbar-color: #D4AF37 #f4f7f6; }
    .categories-wrapper::-webkit-scrollbar { display: block; height: 5px; }
    .categories-wrapper::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    .categories-wrapper::-webkit-scrollbar-track { background: #f4f7f6; }
}
        .categories { display: inline-flex; gap: 12px; }
        .cat-btn { background: white; border: 1.5px solid #e0e0e0; padding: 10px 18px; border-radius: 30px; color: #555; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.05); transition: all 0.3s ease; }
        .cat-btn.active { background: linear-gradient(135deg, #0f2027, #203a43); color: #D4AF37; border: 1.5px solid #0f2027; transform: translateY(-2px); box-shadow: 0 5px 12px rgba(15, 32, 39, 0.3); }

        /* القائمة الجانبية */
        .sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: #fff; z-index: 2000; transition: 0.4s ease; box-shadow: -5px 0 25px rgba(0,0,0,0.3); padding: 25px; overflow-y: auto; border-top-left-radius: 20px; border-bottom-left-radius: 20px; }
        .sidebar.active { right: 0; }
        .close-btn { font-size: 35px; cursor: pointer; color: #e74c3c; float: left; margin-top: -15px; }
        .sidebar h3 { margin-bottom: 25px; color: #0f2027; border-bottom: 3px solid #D4AF37; padding-bottom: 10px; clear: both; font-weight: 900; }
        .sidebar .cat-btn-side { display: block; width: 100%; text-align: right; background: #f9f9f9; border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 12px; color: #333; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 15px; }
        .sidebar .cat-btn-side.active { background: #0f2027; color: #D4AF37; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 1500; display: none; }
        .overlay.active { display: block; }

        /* 👑 تصميم إعلانات VIP الفخمة 👑 */
        .vip-section { padding: 10px 15px 20px 15px; display: none; }
        .vip-title { font-size: 18px; color: #111; margin-bottom: 15px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .vip-title span { background: #D4AF37; color: #fff; padding: 3px 8px; border-radius: 8px; font-size: 12px; }
        
        .vip-scroll { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 15px; padding-top: 5px; scrollbar-width: none; scroll-snap-type: x mandatory; }
        .vip-scroll::-webkit-scrollbar { display: none; }
        
        .vip-card { min-width: 90%; scroll-snap-align: center; background: linear-gradient(180deg, #ffffff 0%, #fffbf0 100%); border-radius: 20px; border: 2px solid #D4AF37; overflow: hidden; box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25); flex-shrink: 0; position: relative; transform: scale(1); transition: 0.3s; }
        .vip-badge { position: absolute; top: 15px; right: 15px; background: linear-gradient(135deg, #FFDF00, #D4AF37); color: #000; padding: 6px 15px; border-radius: 25px; font-weight: 900; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; border: 1px solid #fff; }
        .vip-card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 3px solid #D4AF37; }
        .vip-info { padding: 20px 15px; text-align: center; }
        .vip-info h3 { color: #0f2027; font-size: 20px; font-weight: 900; margin-bottom: 8px; }
        .vip-info p { font-size: 14px; color: #555; margin-bottom: 15px; line-height: 1.5; font-weight: bold; }
        .vip-wa-btn { background: linear-gradient(90deg, #25D366, #128C7E); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 16px; width: 100%; display: block; text-decoration: none; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4); }

        /* 📦 تصميم الإعلانات العادية الهادية 📦 */
        .ad-list { padding: 0 15px 20px 15px; display: flex; flex-direction: column; gap: 15px; }
        .ad-card { background: #fff; border-radius: 16px; display: flex; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.06); border: 1px solid #eaeaea; transition: 0.3s; }
        .ad-card img { width: 110px; height: 120px; object-fit: cover; border-left: 1px solid #eaeaea; }
        .ad-details { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .ad-details h3 { font-size: 16px; color: #222; font-weight: 900; }
        .ad-details p { font-size: 12px; color: #777; margin-top: 5px; line-height: 1.4; }
        .normal-wa-btn { background: #f0f0f0; color: #128C7E; border: 1px solid #25D366; padding: 8px; border-radius: 8px; font-weight: bold; text-align: center; text-decoration: none; font-size: 13px; margin-top: 10px; display: block; transition: 0.3s; }
        .normal-wa-btn:hover { background: #25D366; color: #fff; }

        /* الزر العائم */
        .floating-btn { position: fixed; bottom: 25px; left: 0; right: 0; max-width: 250px; margin: 0 auto; background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; padding: 14px 20px; border-radius: 30px; font-size: 16px; font-weight: 900; box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4); border: 2px solid #fff; cursor: pointer; z-index: 1000; text-decoration: none; text-align: center; transition: 0.3s; }
        .floating-btn:active { transform: scale(0.95); }

        /* لوحة التحكم */
        #admin-dashboard { display: none; background: #fff; border: 2px solid #0f2027; padding: 20px; margin: 15px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .admin-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; margin-bottom: 10px; font-weight: bold; cursor: pointer; color: white; display: block; text-align: center; text-decoration: none; font-size: 15px; }
        
        .status-msg { text-align: center; padding: 30px 20px; color: #888; font-size: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div class="header">
            <div class="menu-icon" onclick="toggleMenu()">☰</div>
            <div class="header-title" id="admin-trigger">
                <h1>دليلك | Daleelak</h1>
                <p>دليلك لأفضل العروض</p>
            </div>
            <div class="spacer"></div>
        </div>

        <div class="sticky-cat" id="sticky-cat">
            <span id="sticky-cat-name">اسم الفئة</span>
            <div class="close-cat" onclick="resetCategory()">✖</div>
        </div>

        <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

        <div class="sidebar" id="sidebar">
            <span class="close-btn" onclick="toggleMenu()">×</span>
            <h3>أقسام الدليل</h3>
            <div id="sidebar-categories-box"></div>
        </div>

        <div id="admin-dashboard">
            <h3 style="color: #0f2027; text-align: center; margin-bottom: 15px;">⚙️ لوحة تحكم الإدارة</h3>
            <a class="admin-btn" style="background: #D4AF37; color: #000;" href="https://docs.google.com/spreadsheets/d/1TA9f759D07O_z3VnIh8krMD0iKpFkwGQCF08_IymtIa08W2XGuhDpjhtgb1Zao-5YKGJ-mHsb3qt70/edit" target="_blank">فتح الشيت لإضافة العروض ↗</a>
            <button class="admin-btn" style="background: #333;" onclick="document.getElementById('admin-dashboard').style.display='none'">إغلاق اللوحة</button>
        </div>

        <div class="welcome-box">✨ كل اللي محتاجه هتلاقيه عندنا! ✨</div>

        <div class="categories-wrapper">
            <div class="categories" id="main-categories"></div>
        </div>

        <div class="vip-section" id="vip-section-block">
            <div class="vip-title">👑 إعلانات مميزة <span>VIP</span></div>
            <div class="vip-scroll" id="vip-container"></div>
        </div>

        <div class="ad-list">
            <h3 id="ads-section-title" style="margin-top: 10px; margin-bottom: 5px; color: #111; font-size: 18px; font-weight: 900;">🔥 أحدث الإعلانات</h3>
            <div id="loading-msg" class="status-msg">⏳ جاري تحديث العروض...</div>
            <div id="ads-container"></div>
        </div>

        <a class="floating-btn" href="https://wa.me/201288023436?text=السلام%20عليكم%20كنت%20عايز%20اضيف%20اعلان%20في%20موقع%20دليلك%20ايه%20هي%20الاسعار%20المتاحه%20للعادي%20وال%20VIP" target="_blank">+ أضف إعلانك معنا</a>

    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTA9f759D07O_z3VnIh8krMD0iKpFkwGQCF08_IymtIa08W2XGuhDpjhtgb1Zao-5YKGJ-mHsb3qt70/pub?gid=1257423716&single=true&output=csv';
        let globalAdsData = []; 

        const appCategories = [
            'الكل', '🏥 الرعاية الصحية', '🍽️ المطاعم والمقاهي', '🛍️ التسوق', '👕 الأزياء والموضة', 
            '💄 الجمال والعناية', '📱 التقنية والإلكترونيات', '🚗 السيارات', '🏠 المنزل والصيانة', 
            '🏢 العقارات', '🎓 التعليم', '💼 الخدمات', '⚽ الرياضة والترفيه', '🎉 المناسبات', 
            '✈️ السفر والسياحة', '🐾 الحيوانات الأليفة', '💳 الخدمات المالية', '🚚 الشحن والتوصيل', '📌 أخرى'
        ];

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function createCategoryLayouts() {
            const mainCatContainer = document.getElementById('main-categories');
            const sideCatContainer = document.getElementById('sidebar-categories-box');
            
            mainCatContainer.innerHTML = '';
            sideCatContainer.innerHTML = '';

            appCategories.forEach(cat => {
                const mainBtn = document.createElement('button');
                mainBtn.className = `cat-btn ${cat === 'الكل' ? 'active' : ''}`;
                mainBtn.innerText = cat;
                mainBtn.onclick = () => selectCategory(cat);
                mainCatContainer.appendChild(mainBtn);

                const sideBtn = document.createElement('button');
                sideBtn.className = `cat-btn-side ${cat === 'الكل' ? 'active' : ''}`;
                sideBtn.innerText = cat;
                sideBtn.onclick = () => selectCategory(cat);
                sideCatContainer.appendChild(sideBtn);
            });
        }

        function parseCSVLine(text) {
            let fields = []; let field = ''; let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { fields.push(field.trim()); field = ''; }
                else { field += char; }
            }
            fields.push(field.trim());
            return fields;
        }

        async function fetchAdsFromGoogleSheet() {
            createCategoryLayouts();
            try {
                const response = await fetch(csvUrl);
                const rawText = await response.text();
                const lines = rawText.split('\n');
                globalAdsData = [];

                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const columns = parseCSVLine(lines[i]);
                    if (!columns[1] || columns[1].trim() === "") continue; 

                    globalAdsData.push({
                        title: columns[1],
                        desc: columns[2] || '',
                        category: columns[3] || '📌 أخرى',
                        img: columns[4] || '',
                        whatsapp: columns[5] || '201288023436',
                        type: columns[6] ? columns[6].trim().toLowerCase() : 'normal',
                        status: columns[7] ? columns[7].trim() : 'شغال'
                    });
                }

                document.getElementById('loading-msg').style.display = 'none';
                renderCategorizedAds('الكل');

            } catch (error) {
                document.getElementById('loading-msg').innerText = '⚠️ حدث خطأ في الاتصال بقاعدة البيانات.';
            }
        }

        function renderCategorizedAds(catName) {
            const vipContainer = document.getElementById('vip-container');
            const adsContainer = document.getElementById('ads-container');
            const vipSectionBlock = document.getElementById('vip-section-block');

            vipContainer.innerHTML = '';
            adsContainer.innerHTML = '';
            let normalAdsCount = 0, vipAdsCount = 0;

            globalAdsData.forEach(ad => {
                if (ad.status === 'موقوف') return; 

                if (catName !== 'الكل') {
                    let cleanSearch = catName.replace(/[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, "").trim();
                    if (!ad.category.includes(cleanSearch)) return;
                }

                const displayImg = ad.img ? ad.img : 'https://i.ibb.co/pjxDzJxM/file-00000000335471f48a03a0acb621d53c.png';
                let cleanPhone = ad.whatsapp.replace(/[^0-9]/g, '');
// الكود ده بيشوف لو الرقم بيبدأ بـ 01 هنضيفله 2 عشان يبقى بكود مصر 20 ويشتغل مع الواتساب
if (cleanPhone.startsWith('01') && cleanPhone.length === 11) {
    cleanPhone = '2' + cleanPhone;
}
const waUrl = `https://wa.me/${cleanPhone}`;
                
                if (ad.type === 'vip') {
                    vipAdsCount++;
                    vipContainer.innerHTML += `
                        <div class="vip-card">
                            <div class="vip-badge">👑 VIP</div>
                            <img src="${displayImg}" alt="VIP Ad">
                            <div class="vip-info">
                                <h3>${ad.title}</h3>
                                <p>${ad.desc}</p>
                                <a href="${waUrl}" target="_blank" class="vip-wa-btn">تواصل عبر الواتساب</a>
                            </div>
                        </div>
                    `;
                } else {
                    normalAdsCount++;
                    adsContainer.innerHTML += `
                        <div class="ad-card">
                            <img src="${displayImg}" alt="Ad Image">
                            <div class="ad-details">
                                <div>
                                    <h3>${ad.title}</h3>
                                    <p>${ad.desc}</p>
                                </div>
                                <a href="${waUrl}" target="_blank" class="normal-wa-btn">مراسلة واتساب</a>
                            </div>
                        </div>
                    `;
                }
            });

            vipSectionBlock.style.display = vipAdsCount > 0 ? 'block' : 'none';
            if (normalAdsCount === 0 && vipAdsCount === 0) {
                adsContainer.innerHTML = `<div class="status-msg">📭 لا توجد عروض في هذا القسم حالياً.</div>`;
            }
        }

        function selectCategory(catName) {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');

            let stickyBar = document.getElementById('sticky-cat');
            let stickyName = document.getElementById('sticky-cat-name');
            let adsTitle = document.getElementById('ads-section-title');

            document.querySelectorAll('.cat-btn, .cat-btn-side').forEach(btn => {
                if (btn.innerText.trim() === catName.trim()) { btn.classList.add('active'); } 
                else { btn.classList.remove('active'); }
            });

            if (catName === 'الكل') {
                stickyBar.style.display = 'none';
                adsTitle.innerText = "🔥 أحدث الإعلانات";
            } else {
                stickyBar.style.display = 'flex';
                stickyName.innerText = catName;
                adsTitle.innerText = `عروض قسم ${catName}`;
            }

            renderCategorizedAds(catName);
        }

        function resetCategory() { selectCategory('الكل'); }

        let headerClicks = 0;
        document.getElementById('admin-trigger').addEventListener('click', () => {
            headerClicks++;
            if (headerClicks === 10) {
                let password = prompt("أدخل الرقم السري للإدارة:");
                if (password === "1234") { document.getElementById('admin-dashboard').style.display = 'block'; }
                else { alert("❌ الرقم السري غير صحيح!"); }
                headerClicks = 0;
            }
        });

        fetchAdsFromGoogleSheet();
    </script>
</body>
</html>
