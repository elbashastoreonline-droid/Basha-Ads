<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل مدينتي الذكي</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 480px; background: white; min-height: 100vh; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        @media (min-width: 768px) { #app-container { max-width: 800px; } }
        .ad-card { padding: 15px; margin-bottom: 15px; border-radius: 15px; border-right: 5px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .VIP { border-right-color: #ffd700; background: #fffdf0; }
        .ad-title { font-weight: bold; font-size: 1.2em; margin-bottom: 5px; }
        .ad-desc { color: #555; margin-bottom: 10px; }
        .btn-whatsapp { display: block; background: #25d366; color: white; text-align: center; padding: 10px; border-radius: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app-container">
        <h2 style="text-align: center;">🔥 أحدث الإعلانات</h2>
        <div id="ads-container">جاري تحميل الإعلانات...</div>
    </div>

    <script>
        // هذا الرابط يربط الشيت بالموقع
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYAm4El3tSVrCFH4rFxGf0ddPxclyccrMOx9-uPPnHmYBjN6DrO3KPZibJKZYK7o7i/exec";

        fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('ads-container');
            container.innerHTML = '';
            data.forEach(ad => {
                const card = document.createElement('div');
                card.className = `ad-card ${ad.type === 'VIP' ? 'VIP' : ''}`;
                card.innerHTML = `
                    <div class="ad-title">${ad.name} ${ad.type === 'VIP' ? '⭐' : ''}</div>
                    <div class="ad-desc">${ad.desc}</div>
                    <a href="https://wa.me/${ad.phone}" class="btn-whatsapp">مراسلة واتساب</a>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
