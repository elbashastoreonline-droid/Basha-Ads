<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليلك | لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1512;--card:#15221c;--card2:#1b2b23;--ink:#edf5ef;--mut:#8fa798;--brand:#2fbf8f;--gold:#f2b93c;--red:#ff6b6b;--line:#22362d}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Almarai',sans-serif}
body{background:var(--bg);color:var(--ink);padding:16px}
button{cursor:pointer;border:none;font-family:inherit}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:.5rem;width:100%}
h1,h2,h3{font-weight:800}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.top h1{font-size:1.2rem;margin-left:auto}
.tab{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:.5rem 1rem;font-weight:800;font-size:.8rem}
.tab.on{background:var(--brand);color:#04241a}
.logout{background:var(--red);color:#fff;border-radius:99px;padding:.5rem 1rem;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.item h3{font-size:.95rem;margin-bottom:6px}
.item .m{color:var(--mut);font-size:.75rem;font-weight:700;margin-bottom:8px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{border-radius:8px;padding:.4rem .7rem;font-weight:800;font-size:.72rem}
.b-ok{background:var(--brand);color:#04241a}.b-no{background:var(--red);color:#fff}
.b-hold{background:var(--gold);color:#3a2a00}.b-ed{background:var(--card2);border:1px solid var(--line)}
.b-ed.on{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
.badge{display:inline-block;font-size:.68rem;font-weight:800;border-radius:99px;padding:.15rem .6rem;margin-bottom:6px}
.st-p{background:#3a2f10;color:var(--gold)}.st-a{background:#0d3a2c;color:var(--brand)}.st-r{background:#3a1414;color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1rem;margin-bottom:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{margin-bottom:8px}.fld label{display:block;font-size:.72rem;font-weight:800;color:var(--mut);margin-bottom:3px}
.save{background:var(--brand);color:#04241a;border-radius:10px;padding:.7rem 1.4rem;font-weight:800;width:100%}
#login{max-width:380px;margin:10vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
#login button{background:var(--brand);color:#04241a;border-radius:10px;padding:.7rem 1.4rem;font-weight:800;width:100%}
#login input{margin-top:8px;text-align:center}
#login .or{margin-top:12px;color:var(--mut);font-size:.75rem;font-weight:700}
.hide{display:none}
.err{background:#3a1414;border:1px solid var(--red);color:#ffb4b4;border-radius:12px;padding:14px;font-size:.8rem;font-weight:700;margin-bottom:12px;white-space:pre-wrap}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal .ov{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.modal .mp{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border:1px solid var(--line);border-radius:16px;padding:20px}
.mhead{display:flex;justify-content:space-between;margin-bottom:12px}
.mx{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card2)}
.tx{border-bottom:1px dashed var(--line);padding:.4rem 0;font-size:.75rem;font-weight:700;display:flex;justify-content:space-between}
.tx .add{color:var(--brand)}.tx .sub{color:var(--red)}
</style>
</head>
<body>
<div id="login"><h2>🔐 لوحة تحكم دليلك</h2><p style="color:var(--mut);font-size:.8rem;margin:10px 0">daleelak317@gmail.com</p>
<button id="gLogin">دخول بحساب جوجل</button>
<div class="or">— أو بالإيميل والباسورد —</div>
<input id="liEmail" type="email" placeholder="الإيميل">
<input id="liPass" type="password" placeholder="الباسورد">
<button id="pLogin">دخول بالباسورد</button>
</div>
<div id="app" class="hide">
<div class="top">
  <h1>🛡️ لوحة تحكم دليلك</h1>
  <button class="tab on" data-t="req">📥 الطلبات</button>
  <button class="tab" data-t="ads">📢 الإعلانات</button>
  <button class="tab" data-t="wallets">💰 المحافظ</button>
  <button class="tab" data-t="splash">🎁 العائم</button>
  <button class="tab" data-t="ticker">📰 الشريط</button>
  <button class="tab" data-t="stories">🗣️ القصص</button>
  <button class="tab" data-t="prices">💎 الأسعار</button>
  <button class="tab" data-t="set">⚙️ إعدادات</button>
  <button class="tab" data-t="areas">🗺️ المناطق</button>
  <button class="logout" id="out">خروج</button>
</div>
<div id="view"></div>
</div>
<div class="modal" id="editModal"><div class="ov" data-close></div><div class="mp" id="editBody"></div></div>
<div class="modal" id="userModal"><div class="ov" data-close></div><div class="mp" id="userBody"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,signInWithPopup,signInWithEmailAndPassword,GoogleAuthProvider,signOut,onAuthStateChanged,updatePassword}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAErZex3BsKMO9cHtalN_Nhb0D7A4tFWe4",authDomain:"daleelak-22dc6.firebaseapp.com",projectId:"daleelak-22dc6",storageBucket:"daleelak-22dc6.firebasestorage.app",messagingSenderId:"774332263419",appId:"1:774332263419:web:527fc4de3d7ed6ce1e395e"});
const db=getFirestore(app),auth=getAuth(app);
const ADMIN=['daleelak317@gmail.com'];
const DEF={badge:"📍 دليل مصر المحلي",h1:"كل اللي محتاجه…",h2:"هتلاقيه عندنا",hl:true,announce:"📢 مفاجأة الافتتاح",wa:"01288023436",insta:"01550720161",voda:"01288023436",coupon:"DALEELAK",prices:{bronze:{day:5,d7:30,d15:60,d30:100},gold:{day:10,d7:50,d15:100,d30:150},plat:{day:20,d7:100,d15:250,d30:500}}};
const GOVS=['القاهرة','الجيزة','القليوبية','الإسكندرية','البحيرة','مطروح','الغربية','المنوفية','الدقهلية','الشرقية','كفر الشيخ','دمياط','بورسعيد','الإسماعيلية','السويس','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','البحر الأحمر','الوادي الجديد','شمال سيناء','جنوب سيناء'];
let S={},REQ=[],ADS=[],TICK=[],STOR=[],AREAS=[],USERS=[],TRANS=[],CUR='req';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const selOpts=(arr,cur)=>arr.map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join('');
function showErr(e){const v=$('#view');if(v)v.innerHTML=`<div class="err">⚠️ خطأ:\n${esc(String(e&&e.message?e.message:e))}</div>`;}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{CUR=b.dataset.t;render();});
$('#out').onclick=()=>signOut(auth);
$('#gLogin').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());}catch(e){alert('⚠️ جوجل: '+(e.message||e));}};
$('#pLogin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,($('#liEmail').value||'').trim(),$('#liPass').value);}catch(e){alert('⚠️ باسورد: '+(e.message||e));}};
onAuthStateChanged(auth,u=>{if(u&&ADMIN.includes(u.email)){$('#login').classList.add('hide');$('#app').classList.remove('hide');loadAll().catch(showErr);}else{$('#login').classList.remove('hide');$('#app').classList.add('hide');}});
async function safe(p){try{return await p;}catch(e){console.warn(e);return null;}}
async function loadAll(){
  const sd=await safe(getDoc(doc(db,'settings','site')));S=(sd&&sd.exists())?sd.data():{};
  const rq=await safe(getDocs(collection(db,'requests')));REQ=rq?rq.docs.map(d=>({id:d.id,...d.data()})):[];
  const ad=await safe(getDocs(collection(db,'ads')));ADS=ad?ad.docs.map(d=>({id:d.id,...d.data()})):[];
  const tk=await safe(getDocs(collection(db,'ticker')));TICK=tk?tk.docs.map(d=>({id:d.id,...d.data()})):[];
  const st=await safe(getDocs(collection(db,'stories')));STOR=st?st.docs.map(d=>({id:d.id,...d.data()})):[];
  const ar=await safe(getDocs(collection(db,'areas')));AREAS=ar?ar.docs.map(d=>({id:d.id,...d.data()})):[];
  const us=await safe(getDocs(collection(db,'users')));USERS=us?us.docs.map(d=>({id:d.id,...d.data()})):[];
  const tr=await safe(getDocs(collection(db,'transactions')));TRANS=tr?tr.docs.map(d=>({id:d.id,...d.data()})):[];
  render();
}
const durDays=r=>r.duration==='s7'?7:r.duration==='s15'?15:r.duration==='s30'?30:(+r.days||1);
async function addTx(uid,type,amount,note,bal){await addDoc(collection(db,'transactions'),{uid,type,amount,note,balanceAfter:bal,createdAt:Date.now()});}
async function refund(uid,amount,note){const u=USERS.find(x=>x.id===uid);if(!u||!amount)return;const nb=(u.balance||0)+amount;await updateDoc(doc(db,'users',uid),{balance:nb});const i=USERS.findIndex(x=>x.id===uid);if(i>=0)USERS[i].balance=nb;await addTx(uid,'refund',amount,note,nb);}
async function approve(r){const days=durDays(r);await addDoc(collection(db,'ads'),{name:r.name,desc:r.desc||'',cat:r.cat||'',img:r.img||'',wa:r.wa||'',phone:r.phone||'',plan:r.plan||'bronze',city:r.city||'',area:r.area||'',loc:r.loc||'',pb:r.pb||'',pa:r.pa||'',sold:r.sold||'',del:r.del||'',code:r.code||'',ver:'',type:r.type||'',ownerUid:r.ownerUid||'',paid:r.total||0,status:'شغال',rank:0,hours:0,startAt:Date.now(),endsAt:Date.now()+days*864e5});await updateDoc(doc(db,'requests',r.id),{status:'approved'});loadAll();}
async function setReq(r,st){await updateDoc(doc(db,'requests',r.id),{status:st});if(st==='rejected'&&r.ownerUid&&r.total)await refund(r.ownerUid,r.total,'استرداد: '+r.name);loadAll();}
async function delAd(id){if(!confirm('حذف الإعلان؟'))return;const a=ADS.find(x=>x.id===id);if(a&&a.ownerUid&&a.paid)await refund(a.ownerUid,a.paid,'استرداد: '+a.name);await deleteDoc(doc(db,'ads',id));loadAll();}
async function toggleAd(a){await updateDoc(doc(db,'ads',a.id),{status:a.status==='شغال'?'موقوف':'شغال'});loadAll();}
async function verifyAd(a){await updateDoc(doc(db,'ads',a.id),{ver:a.ver==='نعم'?'':'نعم'});loadAll();}
async function toSplash(a){async function toTicker(a){const ex=TICK.find(t=>t.adId===a.id);if(ex){await deleteDoc(doc(db,'ticker',ex.id));alert('✅ اتشال من الشريط');}else{await addDoc(collection(db,'ticker'),{txt:'🔥 '+a.name+' — '+(a.cat||''),status:'شغال',adId:a.id});alert('✅ اتضاف للشريط');}loadAll();}
async function toDeal(a){if(a.rank>0){await updateDoc(doc(db,'ads',a.id),{rank:0,hours:0});alert('✅ اتشال من عرض اليوم');}else{const h=prompt('مدة العرض بالساعات:','8');if(!h)return;await updateDoc(doc(db,'ads',a.id),{rank:(Math.max(0,...ADS.map(x=>x.rankasync function renewAd(a){const d=prompt('زود كام يوم؟','7');if(!d)return;await updateDoc(doc(db,'ads',a.id),{endsAt:(a.endsAt||Date.now())+(+d)*864e5,status:'شغال'});loadAll();}
const COLL={req:'requests',ads:'ads',ticker:'ticker',stories:'stories',areas:'areas'};
function openEdit(kind,id){
  const src=kind==='req'?REQ:kind==='ads'?ADS:kind==='ticker'?TICK:kind==='stories'?STOR:AREAS;
  const it=src.find(x=>x.id===id);if(!it)return;
  const planOpts=['bronze','gold','plat'].map(p=>`<option value="${p}" ${it.plan===p?'selected':''}>${p==='bronze'?'🥉 برونزي':p==='gold'?'👑 ذهبي':'💎 ماسي'}</option>`).join('');
  const govOpts=selOpts([...new Set([...GOVS,...Object.keys(AREAS),it.city||''])].filter(Boolean),it.city);
  const areaOpts=selOpts([...new Set([...(AREAS[it.city]||[]),it.area||''])].filter(Boolean),it.area);
  const stOpts=selOpts(['شغال','موقوف'],it.status);
  const tkOpts=selOpts(['شغال','مخفي'],it.status);
  const verOpts=`<option value="" ${!it.ver?'selected':''}>لا</option><option value="نعم" ${it.ver==='نعم'?'selected':''}>نعم ✔</option>`;
  const F={
    req:[['name','الاسم'],['plan','الباقة','sel',planOpts],['total','الإجمالي','number'],['city','المحافظة','sel',govOpts],['area','المنطقة','sel',areaOpts],['wa','واتساب'],['sender','المحوّل منه'],['img','لينك صورة'],['payImg','لينك سكرين'],['days','أيام','number'],['status','الحالة','sel',stOpts]],
    ads:[['name','الاسم'],['cat','الفئة'],['city','المحافظة','sel',govOpts],['area','المنطقة','sel',areaOpts],['plan','الباقة','sel',planOpts],['pa','سعر بعد','number'],['pb','سعر قبل','number'],['desc','الوصف'],['img','لينك صورة'],['wa','واتساب'],['phone','اتصال'],['loc','لوكيشن'],['ver','موثوق','sel',verOpts],['rank','ترتيب عرض اليوم','number'],['hours','ساعات','number'],['paid','المبلغ المدفوع','number'],['status','الحالة','sel',stOpts]],
    ticker:[['txt','الجملة'],['status','الحالة','sel',tkOpts]],
    stories:[['name','الاسم'],['text','القصة'],['status','الحالة','sel',tkOpts]],
    areas:[['gov','المحافظة','sel',govOpts],['area','المنطقة']]
  }[kind];
  $('#editBody').innerHTML=`<div class="mhead"><h3>✏️ تعديل</h3><button class="mx" id="eClose">✕</button></div>`+F.map(f=>f[2]==='sel'?`<div class="fld"><label>${f[1]}</label><select data-k="${f[0]}">${f[3]}</select></div>`:`<div class="fld"><label>${f[1]}</label><input data-k="${f[0]}" type="${f[2]||'text'}" value="${esc(it[f[0]]||'')}"></div>`).join('')+`<button class="save" id="eSave">💾 حفظ</button>`;
  $('#editModal').classList.add('open');
  $('#eClose').onclick=()=>$('#editModal').classList.remove('open');
  $('#eSave').onclick=async()=>{const up={};$$('#editBody [data-k]').forEach(i=>{up[i.dataset.k]=i.type==='number'?+i.value:i.value;});await updateDoc(doc(db,COLL[kind],id),up);$('#editModal').classList.remove('open');loadAll();};
}
function openUser(uid){
  const u=USERS.find(x=>x.id===uid);if(!u)return;
  const tx=TRANS.filter(t=>t.uid===uid).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  $('#userBody').innerHTML=`<div class="mhead"><h3>👤 ${esc(u.name||u.email||'مستخدم')}</h3><button class="mx" id="uClose">✕</button></div>
   <div class="item"><div class="m">📱 ${esc(u.phone||'—')} • 💰 الرصيد: <b style="color:var(--gold)">${u.balance||0} ج</b></div>
   <div class="f2"><div class="fld"><label>تزويد (+)</label><input id="uAdd" type="number" placeholder="0"></div><div class="fld"><label>تقليص (−)</label><input id="uSub" type="number" placeholder="0"></div></div>
   <div class="fld"><label>أو ضبط الرصيد لـ</label><input id="uSet" type="number" placeholder="اتركه فاضي"></div>
   <div class="fld"><label>ملاحظة</label><input id="uNote" placeholder="سبب التعديل"></div>
   <button class="save" id="uSave">💾 حفظ الرصيد</button></div>
   <h3 style="margin:12px 0 8px">📒 سجل الحركات</h3>`+
   (tx.length?tx.map(t=>`<div class="tx"><span>${esc(t.note||t.type)}</span><span class="${(t.type==='add'||t.type==='gift'||t.type==='refund')?'add':'sub'}">${(t.type==='add'||t.type==='gift'||t.type==='refund')?'+':'−'}${t.amount} ج</span></div>`).join(''):'<p style="color:var(--mut);font-size:.75rem">لسه مفيش حركات.</p>');
  $('#userModal').classList.add('open');
  $('#uClose').onclick=()=>$('#userModal').classList.remove('open');
  $('#uSave').onclick=async()=>{const add=+$('#uAdd').value||0,sub=+$('#uSub').value||0,set=$('#uSet').value,note=$('#uNote').value||'تعديل يدوي';
    let nb=u.balance||0,typ='edit';
    if(set!==''){nb=+set;}else{nb=nb+add-sub;typ=add>0?'add':'deduct';}
    await updateDoc(doc(db,'users',uid),{balance:nb});await addTx(uid,typ,Math.abs(add||sub||nb),note,nb);
    $('#userModal').classList.remove('open');loadAll();};
}
async function sendGift(list,amount,label){for(const u of list){const nb=(u.balance||0)+amount;await updateDoc(doc(db,'users',u.id),{balance:nb});await addTx(u.id,'gift',amount,label,nb);}alert('✅ وصلت الهدية لـ '+list.length+' مستخدم');loadAll();}
function render(){
  try{
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===CUR));
  const v=$('#view');
  if(CUR==='req'){const list=REQ.filter(r=>r.status!=='approved');
    v.innerHTML=`<div class="panel"><h2>📥 الطلبات المعلقة (${list.length})</h2><div class="grid">`+(list.map(r=>`<div class="item"><span class="badge st-p">${esc(r.status||'معلق')}</span><h3>${esc(r.name)}</h3><div class="m">${esc(r.plan)} • ${esc(r.city)} • ${esc(r.total)} ج</div><div class="row"><button class="btn b-ok" data-a="ok" data-id="${r.id}">✅ نشر</button><button class="btn b-hold" data-a="hold" data-id="${r.id}">⏸ تأجيل</button><button class="btn b-no" data-a="rej" data-id="${r.id}">❌ رفض</button><button class="btn b-ed" data-e="req" data-id="${r.id}">✏️ تعديل</button></div></div>`).join('')||'<p style="color:var(--mut)">مفيش طلبات معلقة ✅</p>')+`</div></div>`;
  }
  else if(CUR==='ads'){v.innerHTML=`<div class="panel"><h2>📢 الإعلانات (${ADS.length})</h2><div class="grid">`+ADS.map(a=>{const isDeal=a.rank>0;const isFloat=S.splash&&S.splash.adId===a.id&&S.splash.active;const isTick=TICK.some(t=>t.adId===a.id);return `<div class="item"><span class="badge ${a.status==='شغال'?'st-a':'st-r'}">${esc(a.status)}</span>${a.ver==='نعم'?'<span class="badge st-a">✔ موثوق</span>':''}${isDeal?'<span class="badge st-p">⏰ عرض اليوم</span>':''}${isFloat?'<span class="badge st-p">🎁 عائم</span>':''}${isTick?'<span class="badge st-p">📰 شريط</span>':''}<h3>${esc(a.name)}</h3><div class="m">${esc(a.plan)} • ${esc(a.city)}${a.endsAt?'<br>⏳ ينتهي: '+new Date(a.endsAt).toLocaleDateString('ar-EG'):''}</div><div class="row"><button class="btn b-ed ${a.status==='شغال'?'on':''}" data-a="tg" data-id="${a.id}">${a.status==='شغال'?'⏸ إيقاف':'▶ تفعيل'}</button><button class="btn b-ed ${a.ver==='نعم'?'on':''}" data-a="vf" data-id="${a.id}">✔ موثوق</button><button class="btn b-ed ${isDeal?'on':''}" data-a="dl" data-id="${a.id}">⏰ عرض اليوم</button><button class="btn b-ed ${isTick?'on':''}" data-a="tk" data-id="${a.id}">📰 الشريط</button><button class="btn b-ed ${isFloat?'on':''}" data-a="sp" data-id="${a.id}">🎯 عائم</button><button class="btn b-ed" data-a="rn" data-id="${a.id}">🔄 تجديد</button><button class="btn b-ed" data-e="ads" data-id="${a.id}">✏️ تعديل</button><button class="btn b-no" data-a="del" data-id="${a.id}">🗑 حذف</button></div></div>`;}).join('')+`</div></div>`;}
  else if(CUR==='wallets'){v.innerHTML=`<div class="panel"><h2>🎁 إرسال هدية رصيد</h2><div class="f2"><div class="fld"><label>الهدف</label><select id="gTarget"><option value="all">كل المستخدمين</option><option value="plat">💎 فئة الماسي</option><option value="gold">👑 فئة الذهبي</option><option value="bronze">🥉 فئة البرونزي</option><option value="sel">👥 أشخاص محددين</option></select></div><div class="fld"><label>المبلغ (ج)</label><input id="gAmount" type="number" placeholder="20"></div></div><div class="fld" id="gSelWrap" style="display:none"><label>اختار الأشخاص</label><div id="gSel" style="max-height:150px;overflow-y:auto">${USERS.map(u=>`<label style="display:block;font-size:.75rem"><input type="checkbox" value="${u.id}" style="width:auto"> ${esc(u.name||u.email)} (${u.balance||0}ج)</label>`).join('')}</div></div><div class="fld"><label>ملاحظة</label><input id="gNote" placeholder="مكافأة"></div><button class="save" id="gSend">🎁 إرسال</button></div><div class="panel"><h2>💰 المحافظ (${USERS.length})</h2><div class="grid">${USERS.map(u=>`<div class="item"><h3>${esc(u.name||u.email)}</h3><div class="m">📱 ${esc(u.phone||'—')}<br>💰 الرصيد: <b style="color:var(--gold)">${u.balance||0} ج</b></div><div class="row"><button class="btn b-ed" data-u="${u.id}">👁 سجل</button><button class="btn b-hold" data-g="${u.id}">🎁 هدية</button></div></div>`).join('')||'<p>مفيش مستخدمين.</p>'}</div></div>`;
    $('#gTarget').onchange=e=>{$('#gSelWrap').style.display=e.target.value==='sel'?'':'none';};
    $('#gSend').onclick=async()=>{const amt=+$('#gAmount').value||0;if(!amt){alert('اكتب المبلغ');return;}const t=$('#gTarget').value;const note=$('#gNote').value||'هدية';
      let list=USERS;if(t==='plat')list=USERS.filter(u=>/plat|بلاتيني|ماسي/.test(u.plan||''));else if(t==='gold')list=USERS.filter(u=>/gold|VIP|ذهبي/.test(u.plan||''));else if(t==='bronze')list=USERS.filter(u=>/bronze|عادي|برونزي/.test(u.plan||''));else if(t==='sel'){const ids=[...$$('#gSel input:checked')].map(i=>i.value);list=USERS.filter(u=>ids.includes(u.id));}
      if(!list.length){alert('مفيش');return;}sendGift(list,amt,note);};
    v.onclick=e=>{const u=e.target.closest('[data-u]');if(u){openUser(u.dataset.u);return;}const g=e.target.closest('[data-g]');if(g){$('#gTarget').value='sel';$('#gSelWrap').style.display='';const cb=document.querySelector(`#gSel input[value="${g.dataset.g}"]`);if(cb)cb.checked=true;}};
  }
  else if(CUR==='splash'){const sp=S.splash||{};v.innerHTML=`<div class="panel"><h2>🎁 الإعلان العائم</h2><div class="fld"><label>اربطه بإعلان</label><select id="spAd"><option value="">— بدون —</option>${ADS.map(a=>`<option value="${a.id}" ${sp.adId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="fld"><label>الاسم</label><input id="spName" value="${esc(sp.name||'')}"></div><div class="fld"><label>الصورة</label><input id="spImg" value="${esc(sp.img||'')}"></div><div class="fld"><label>واتساب</label><input id="spWa" value="${esc(sp.wa||'')}"></div><div class="f2"><div class="fld"><label>سعر 8 ساعات</label><input id="sp8" type="number" value="${sp.price8||50}"></div><div class="fld"><label>سعر اليوم</label><input id="spD" type="number" value="${sp.priceDay||100}"></div></div><div class="fld"><label><input type="checkbox" id="spOn" style="width:auto" ${sp.active?'checked':''}> مفعّل</label></div><button class="save" id="spSave">💾 حفظ</button></div>`;
    $('#spSave').onclick=async()=>{await setDoc(doc(db,'settings','site'),{...S,splash:{active:$('#spOn').checked,img:$('#spImg').value,adId:$('#spAd').value,name:$('#spName').value,wa:$('#spWa').value,price8:+$('#sp8').value,priceDay:+$('#spD').value,id:(S.splash&&S.splash.id)||('sp'+Date.now())}});alert('✅ تم');loadAll();};
  }
  else if(CUR==='ticker'){v.innerHTML=`<div class="panel"><h2>📰 الشريط</h2><div class="fld"><input id="tkNew" placeholder="جملة…"></div><button class="save" id="tkAdd">➕ إضافة</button><div class="grid" style="margin-top:12px">`+TICK.map(t=>`<div class="item"><h3>${esc(t.txt)}</h3><div class="row"><button class="btn b-ed" data-e="ticker" data-id="${t.id}">✏️ تعديل</button><button class="btn b-ed" data-a="tg" data-id="${t.id}">${t.status==='مخفي'?'إظهار':'إخفاء'}</button><button class="btn b-no" data-a="del" data-id="${t.id}">🗑 حذف</button></div></div>`).join('')+`</div></div>`;
    $('#tkAdd').onclick=async()=>{if(!$('#tkNew').value)return;await addDoc(collection(db,'ticker'),{txt:$('#tkNew').value,status:'شغال'});loadAll();};
  }
  else if(CUR==='stories'){v.innerHTML=`<div class="panel"><h2>🗣️ القصص</h2><div class="f2"><div class="fld"><input id="stName" placeholder="الاسم"></div><div class="fld"><input id="stTxt" placeholder="القصة"></div></div><button class="save" id="stAdd">➕ إضافة</button><div class="grid" style="margin-top:12px">`+STOR.map(t=>`<div class="item"><h3>${esc(t.name)}</h3><div class="m">${esc(t.text)}</div><div class="row"><button class="btn b-ed" data-e="stories" data-id="${t.id}">✏️ تعديل</button><button class="btn b-ed" data-a="tg" data-id="${t.id}">${t.status==='مخفي'?'إظهار':'إخفاء'}</button><button class="btn b-no" data-a="del" data-id="${t.id}">🗑 حذف</button></div></div>`).join('')+`</div></div>`;
    $('#stAdd').onclick=async()=>{if(!$('#stTxt').value)return;await addDoc(collection(db,'stories'),{name:$('#stName').value,text:$('#stTxt').value,status:'شغال'});loadAll();};
  }
  else if(CUR==='prices'){const P=S.prices||DEF.prices;v.innerHTML=`<div class="panel"><h2>💎 الأسعار</h2>`+['bronze','gold','plat'].map(k=>`<h3>${k==='bronze'?'🥉 برونزي':k==='gold'?'👑 ذهبي':'💎 ماسي'}</h3><div class="f2"><div class="fld"><label>اليوم</label><input type="number" id="p_${k}_day" value="${P[k].day}"></div><div class="fld"><label>7 أيام</label><input type="number" id="p_${k}_d7" value="${P[k].d7}"></div><div class="fld"><label>15 يوم</label><input type="number" id="p_${k}_d15" value="${P[k].d15}"></div><div class="fld"><label>30 يوم</label><input type="number" id="p_${k}_d30" value="${P[k].d30}"></div></div>`).join('')+`<button class="save" id="pSave">💾 حفظ</button></div>`;
    $('#pSave').onclick=async()=>{const np={};['bronze','gold','plat'].forEach(k=>{np[k]={day:+$('#p_'+k+'_day').value,d7:+$('#p_'+k+'_d7').value,d15:+$('#p_'+k+'_d15').value,d30:+$('#p_'+k+'_d30').value};});await setDoc(doc(db,'settings','site'),{...S,prices:np});alert('✅ تم');loadAll();};
  }
  else if(CUR==='set'){v.innerHTML=`<div class="panel"><h2>⚙️ إعدادات</h2><div class="fld"><label>البادج</label><input id="sBadge" value="${esc(S.badge||DEF.badge)}"></div><div class="fld"><label>العنوان الأول</label><input id="sH1" value="${esc(S.h1||DEF.h1)}"></div><div class="fld"><label>العنوان الثاني</label><input id="sH2" value="${esc(S.h2||DEF.h2)}"></div><div class="fld"><label>جملة الافتتاح</label><input id="sAnn" value="${esc(S.announce||DEF.announce)}"></div><div class="fld"><label>كود الخصم</label><input id="sCoup" value="${esc(S.coupon||DEF.coupon)}"></div><div class="f2"><div class="fld"><label>واتساب</label><input id="sWa" value="${esc(S.wa||DEF.wa)}"></div><div class="fld"><label>إنستاباي</label><input id="sIn" value="${esc(S.insta||DEF.insta)}"></div></div><div class="fld"><label>فودافون</label><input id="sVo" value="${esc(S.voda||DEF.voda)}"></div><button class="save" id="sSave">💾 حفظ</button><h2 style="margin-top:16px">🔑 الباسورد</h2><div class="fld"><label>جديد</label><input id="newPass" type="password"></div><div class="fld"><label>تأكيد</label><input id="confPass" type="password"></div><button class="save" id="chPass">🔑 تغيير</button></div>`;
    $('#sSave').onclick=async()=>{await setDoc(doc(db,'settings','site'),{...S,badge:$('#sBadge').value,h1:$('#sH1').value,h2:$('#sH2').value,announce:$('#sAnn').value,coupon:$('#sCoup').value,wa:$('#sWa').value,insta:$('#sIn').value,voda:$('#sVo').value});alert('✅ تم');loadAll();};
    $('#chPass').onclick=async()=>{const p=$('#newPass').value,c=$('#confPass').value;if(!p||p.length<6){alert('6 أحرف');return;}if(p!==c){alert('مش مطابق');return;}try{await updatePassword(auth.currentUser,p);alert('✅ اتغير');}catch(e){alert('⚠️ '+e.message);}};
  }
  else if(CUR==='areas'){const govKeys=[...new Set([...GOVS,...Object.keys(AREAS)])];
    v.innerHTML=`<div class="panel"><h2>🗺️ المناطق</h2><div class="f2"><div class="fld"><label>المحافظة</label><select id="arGov">${govKeys.map(g=>`<option>${esc(g)}</option>`).join('')}<option value="__custom">✏️ أخرى</option></select></div><div class="fld"><label>المنطقة</label><input id="arArea" placeholder="اكتب"></div></div><div class="fld" id="arGovCWrap" style="display:none"><label>✏️ المحافظة</label><input id="arGovC"></div><div class="fld"><label>الموجوده</label><div id="arHint" style="color:var(--mut);font-size:.75rem"></div></div><button class="save" id="arAdd">➕ إضافة</button><div class="grid" style="margin-top:12px">${AREAS.map(t=>`<div class="item"><h3>${esc(t.gov)} — ${esc(t.area)}</h3><div class="row"><button class="btn b-ed" data-e="areas" data-id="${t.id}">✏️ تعديل</button><button class="btn b-no" data-a="del" data-id="${t.id}">🗑 حذف</button></div></div>`).join('')}</div></div>`;
    const hint=()=>{let g=$('#arGov').value;if(g==='__custom')g=$('#arGovC').value.trim();$('#arGovCWrap').style.display=$('#arGov').value==='__custom'?'':'none';$('#arHint').textContent=(AREAS[g]||[]).length?AREAS[g].join('، '):'(مفيش)';};
    $('#arGov').onchange=hint;$('#arGovC').oninput=hint;hint();
    $('#arAdd').onclick=async()=>{let gov=$('#arGov').value;if(gov==='__custom')gov=$('#arGovC').value.trim();const area=$('#arArea').value.trim();if(!gov||!area){alert('اكمل');return;}if((AREAS[gov]||[]).includes(area)){alert('موجوده');return;}await addDoc(collection(db,'areas'),{gov,area});loadAll();};
  }
  v.onclick=async e=>{
    const ed=e.target.closest('[data-e]');if(ed){openEdit(ed.dataset.e,ed.dataset.id);return;}
    const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.id,act=b.dataset.a;
    if(CUR==='req'){const r=REQ.find(x=>x.id===id);if(act==='ok')approve(r);if(act==='hold')setReq(r,'hold');if(act==='rej')setReq(r,'rejected');}
    else if(CUR==='ads'){const a=ADS.find(x=>x.id===id);const m={tg:toggleAd,vf:verifyAd,dl:toDeal,tk:toTicker,sp:toSplash,rn:renewAd};if(act==='del')delAd(id);else m[act](a);}
    else if(CUR==='ticker'){const t=TICK.find(x=>x.id===id);if(act==='del'){if(!confirm('حذف من الشريط؟'))return;await deleteDoc(doc(db,'ticker',id));}else await updateDoc(doc(db,'ticker',id),{status:t.status==='مخفي'?'شغال':'مخفي'});loadAll();}
    else if(CUR==='stories'){const t=STOR.find(x=>x.id===id);if(act==='del'){if(!confirm('حذف القصة؟'))return;await deleteDoc(doc(db,'stories',id));}else await updateDoc(doc(db,'stories',id),{status:t.status==='مخفي'?'شغال':'مخفي'});loadAll();}
    else if(CUR==='areas'){if(act==='del'){if(!confirm('حذف المنطقة؟'))return;await deleteDoc(doc(db,'areas',id));loadAll();}}
  };
  }catch(e){showErr(e);}
}
</script>
</body>
</html>
