<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليلك | لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1512;--card:#15221c;--card2:#1b2b23;--ink:#edf5ef;--mut:#8fa798;--brand:#2fbf8f;--gold:#f2b93c;--red:#ff6b6b;--line:#22362d}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Almarai',sans-serif}
body{background:var(--bg);color:var(--ink);padding:16px}
button{cursor:pointer;border:none;font-family:inherit}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:.5rem;width:100%}
h1,h2,h3{font-weight:800}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.top h1{font-size:1.2rem;margin-left:auto}
.tab{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:.5rem 1rem;font-weight:800;font-size:.8rem}
.tab.on{background:var(--brand);color:#04241a}
.logout{background:var(--red);color:#fff;border-radius:99px;padding:.5rem 1rem;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.item h3{font-size:.95rem;margin-bottom:6px}
.item .m{color:var(--mut);font-size:.75rem;font-weight:700;margin-bottom:8px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{border-radius:8px;padding:.4rem .7rem;font-weight:800;font-size:.72rem}
.b-ok{background:var(--brand);color:#04241a}.b-no{background:var(--red);color:#fff}
.b-hold{background:var(--gold);color:#3a2a00}.b-ed{background:var(--card2);border:1px solid var(--line)}
.badge{display:inline-block;font-size:.68rem;font-weight:800;border-radius:99px;padding:.15rem .6rem;margin-bottom:6px}
.st-p{background:#3a2f10;color:var(--gold)}.st-a{background:#0d3a2c;color:var(--brand)}.st-r{background:#3a1414;color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1rem;margin-bottom:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{margin-bottom:8px}.fld label{display:block;font-size:.72rem;font-weight:800;color:var(--mut);margin-bottom:3px}
.save{background:var(--brand);color:#04241a;border-radius:10px;padding:.7rem 1.4rem;font-weight:800;width:100%}
#login{max-width:380px;margin:10vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
#login button{background:var(--brand);color:#04241a;border-radius:10px;padding:.7rem 1.4rem;font-weight:800;width:100%}
.hide{display:none}
.err{background:#3a1414;border:1px solid var(--red);color:#ffb4b4;border-radius:12px;padding:14px;font-size:.8rem;font-weight:700;margin-bottom:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="login"><h2>🔐 لوحة تحكم دليلك</h2><p style="color:var(--mut);font-size:.8rem;margin:10px 0">الدخول بحساب الإدارة: daleelak317@gmail.com</p><button id="gLogin">دخول بحساب جوجل</button></div>
<div id="app" class="hide">
<div class="top">
  <h1>🛡️ لوحة تحكم دليلك</h1>
  <button class="tab on" data-t="req">📥 الطلبات</button>
  <button class="tab" data-t="ads">📢 الإعلانات</button>
  <button class="tab" data-t="splash">🎁 العائم</button>
  <button class="tab" data-t="ticker">📰 الشريط</button>
  <button class="tab" data-t="stories">🗣️ القصص</button>
  <button class="tab" data-t="prices">💎 الأسعار</button>
  <button class="tab" data-t="set">⚙️ إعدادات</button>
  <button class="tab" data-t="areas">🗺️ المناطق</button>
  <button class="logout" id="out">خروج</button>
</div>
<div id="view"></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getAuth,signInWithPopup,GoogleAuthProvider,signOut,onAuthStateChanged,updatePassword}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAErZex3BsKMO9cHtalN_Nhb0D7A4tFWe4",authDomain:"daleelak-22dc6.firebaseapp.com",projectId:"daleelak-22dc6",storageBucket:"daleelak-22dc6.firebasestorage.app",messagingSenderId:"774332263419",appId:"1:774332263419:web:527fc4de3d7ed6ce1e395e"});
const db=getFirestore(app),auth=getAuth(app);
const ADMIN=['daleelak317@gmail.com'];
let S={},REQ=[],ADS=[],TICK=[],STOR=[],AREAS=[],CUR='req';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showErr(e){$('#view').innerHTML=`<div class="err">⚠️ حصل خطأ:\n${esc(String(e&&e.message?e.message:e))}\n\nتأكد إنك:\n1) نشرت قواعد Firestore.\n2) داخل بحساب ${ADMIN[0]}.</div>`;}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{CUR=b.dataset.t;render();});
$('#out').onclick=()=>signOut(auth);
$('#gLogin').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(showErr);
onAuthStateChanged(auth,u=>{
  if(u&&ADMIN.includes(u.email)){$('#login').classList.add('hide');$('#app').classList.remove('hide');loadAll().catch(showErr);}
  else{$('#login').classList.remove('hide');$('#app').classList.add('hide');}
});
async function safe(p){try{return await p;}catch(e){console.warn(e);return null;}}
async function loadAll(){
  const sd=await safe(getDoc(doc(db,'settings','site')));S=(sd&&sd.exists())?sd.data():{};
  const rq=await safe(getDocs(collection(db,'requests')));REQ=rq?rq.docs.map(d=>({id:d.id,...d.data()})):[];
  const ad=await safe(getDocs(collection(db,'ads')));ADS=ad?ad.docs.map(d=>({id:d.id,...d.data()})):[];
  const tk=await safe(getDocs(collection(db,'ticker')));TICK=tk?tk.docs.map(d=>({id:d.id,...d.data()})):[];
  const st=await safe(getDocs(collection(db,'stories')));STOR=st?st.docs.map(d=>({id:d.id,...d.data()})):[];
  const ar=await safe(getDocs(collection(db,'areas')));AREAS=ar?ar.docs.map(d=>({id:d.id,...d.data()})):[];
  render();
}
const durDays=r=>r.duration==='s7'?7:r.duration==='s15'?15:r.duration==='s30'?30:(+r.days||1);
async function approve(r){const days=durDays(r);await addDoc(collection(db,'ads'),{name:r.name,desc:r.desc||'',cat:r.cat||'',img:r.img||'',wa:r.wa||'',phone:r.phone||'',plan:r.plan||'bronze',city:r.city||'',area:r.area||'',loc:r.loc||'',pb:r.pb||'',pa:r.pa||'',sold:r.sold||'',del:r.del||'',code:r.code||'',ver:'',type:r.type||'',status:'شغال',rank:0,hours:0,startAt:Date.now(),endsAt:Date.now()+days*864e5});await updateDoc(doc(db,'requests',r.id),{status:'approved'});loadAll();}
async function setReq(r,st){await updateDoc(doc(db,'requests',r.id),{status:st});loadAll();}
async function delAd(id){if(confirm('حذف الإعلان؟')){await deleteDoc(doc(db,'ads',id));loadAll();}}
async function toggleAd(a){await updateDoc(doc(db,'ads',a.id),{status:a.status==='شغال'?'موقوف':'شغال'});loadAll();}
async function verifyAd(a){await updateDoc(doc(db,'ads',a.id),{ver:a.ver==='نعم'?'':'نعم'});loadAll();}
async function toSplash(a){await setDoc(doc(db,'settings','site'),{...S,splash:{active:true,img:a.img||'',link:a.loc||'#',adId:a.id,name:a.name,wa:a.wa,desc:a.desc,id:'ad'+a.id,price8:50,priceDay:100}});alert('✅ بقى الإعلان العائم');loadAll();}
async function toTicker(a){await addDoc(collection(db,'ticker'),{txt:'🔥 '+a.name+' — '+(a.cat||''),status:'شغال'});alert('✅ اتضاف للشريط');loadAll();}
async function toDeal(a){const h=prompt('مدة العرض بالساعات:','8');if(!h)return;await updateDoc(doc(db,'ads',a.id),{rank:(Math.max(0,...ADS.map(x=>x.rank||0))+1),hours:+h});alert('✅ دخل طابور عرض اليوم');loadAll();}
async function renewAd(a){const d=prompt('زود كام يوم؟','7');if(!d)return;await updateDoc(doc(db,'ads',a.id),{endsAt:(a.endsAt||Date.now())+(+d)*864e5,status:'شغال'});loadAll();}
function render(){
  try{
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===CUR));
  const v=$('#view');
  if(CUR==='req'){const list=REQ.filter(r=>r.status!=='approved');
    v.innerHTML=`<div class="panel"><h2>📥 الطلبات المعلقة (${list.length})</h2><div class="grid">`+(list.map(r=>`<div class="item"><span class="badge st-p">${esc(r.status||'معلق')}</span><h3>${esc(r.name)}</h3><div class="m">${esc(r.plan)} • ${esc(r.city)} • ${esc(r.total)} ج<br>📱 ${esc(r.wa)}${r.senderPhone?'<br>💳 المحوّل منه: '+esc(r.senderPhone):''}</div><div class="row"><button class="btn b-ok" data-a="ok" data-id="${r.id}">✅ نشر</button><button class="btn b-hold" data-a="hold" data-id="${r.id}">⏸</button><button class="btn b-no" data-a="rej" data-id="${r.id}">❌</button></div></div>`).join('')||'<p style="color:var(--mut)">مفيش طلبات معلقة ✅</p>')+`</div></div>`;
    v.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=REQ.find(x=>x.id===b.dataset.id);if(b.dataset.a==='ok')approve(r);if(b.dataset.a==='hold')setReq(r,'hold');if(b.dataset.a==='rej')setReq(r,'rejected');};
  }
  else if(CUR==='ads'){v.innerHTML=`<div class="panel"><h2>📢 الإعلانات (${ADS.length})</h2><div class="grid">`+ADS.map(a=>`<div class="item"><span class="badge ${a.status==='شغال'?'st-a':'st-r'}">${esc(a.status)}</span>${a.ver==='نعم'?'<span class="badge st-a">✔ موثوق</span>':''}<h3>${esc(a.name)}</h3><div class="m">${esc(a.plan)} • ${esc(a.city)}${a.endsAt?'<br>⏳ ينتهي: '+new Date(a.endsAt).toLocaleDateString('ar-EG'):''}</div><div class="row"><button class="btn b-ed" data-a="tg" data-id="${a.id}">${a.status==='شغال'?'إيقاف':'تفعيل'}</button><button class="btn b-ed" data-a="vf" data-id="${a.id}">✔ موثوق</button><button class="btn b-hold" data-a="dl" data-id="${a.id}">⏰ عرض اليوم</button><button class="btn b-ed" data-a="tk" data-id="${a.id}">📰 الشريط</button><button class="btn b-hold" data-a="sp" data-id="${a.id}">🎯 عائم</button><button class="btn b-ed" data-a="rn" data-id="${a.id}">🔄 تجديد</button><button class="btn b-no" data-a="del" data-id="${a.id}">🗑</button></div></div>`).join('')+`</div></div>`;
    v.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=ADS.find(x=>x.id===b.dataset.id);const m={tg:toggleAd,vf:verifyAd,dl:toDeal,tk:toTicker,sp:toSplash,rn:renewAd};if(b.dataset.a==='del')delAd(a.id);else m[b.dataset.a](a);};
  }
  else if(CUR==='splash'){const sp=S.splash||{};v.innerHTML=`<div class="panel"><h2>🎁 الإعلان العائم</h2>
    <div class="fld"><label>اربطه بإعلان موجود (يفتح تفاصيله)</label><select id="spAd"><option value="">— بدون ربط —</option>${ADS.map(a=>`<option value="${a.id}" ${sp.adId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
    <div class="fld"><label>اسم الإعلان</label><input id="spName" value="${esc(sp.name||'')}"></div>
    <div class="fld"><label>لينك الصورة</label><input id="spImg" value="${esc(sp.img||'')}"></div>
    <div class="fld"><label>واتساب</label><input id="spWa" value="${esc(sp.wa||'')}"></div>
    <div class="fld"><label>وصف</label><input id="spDesc" value="${esc(sp.desc||'')}"></div>
    <div class="fld"><label>لينك خارجي (اختياري)</label><input id="spLink" value="${esc(sp.link||'')}"></div>
    <div class="f2"><div class="fld"><label>سعر 8 ساعات</label><input id="sp8" type="number" value="${sp.price8||50}"></div><div class="fld"><label>سعر اليوم</label><input id="spD" type="number" value="${sp.priceDay||100}"></div></div>
    <div class="fld"><label><input type="checkbox" id="spOn" style="width:auto" ${sp.active?'checked':''}> مفعّل</label></div>
    <button class="save" id="spSave">💾 حفظ</button></div>`;
    $('#spSave').onclick=async()=>{await setDoc(doc(db,'settings','site'),{...S,splash:{active:$('#spOn').checked,img:$('#spImg').value,link:$('#spLink').value,adId:$('#spAd').value,name:$('#spName').value,wa:$('#spWa').value,desc:$('#spDesc').value,price8:+$('#sp8').value,priceDay:+$('#spD').value,id:(S.splash&&S.splash.id)||('sp'+Date.now())}});alert('✅ تم الحفظ');loadAll();};
  }
  else if(CUR==='ticker'){v.innerHTML=`<div class="panel"><h2>📰 الشريط</h2><div class="fld"><input id="tkNew" placeholder="اكتب جملة…"></div><button class="save" id="tkAdd">➕ إضافة</button><div class="grid" style="margin-top:12px">`+TICK.map(t=>`<div class="item"><h3>${esc(t.txt)}</h3><div class="row"><button class="btn b-ed" data-a="tg" data-id="${t.id}">${t.status==='مخفي'?'إظهار':'إخفاء'}</button><button class="btn b-no" data-a="del" data-id="${t.id}">🗑</button></div></div>`).join('')+`</div></div>`;
    $('#tkAdd').onclick=async()=>{if(!$('#tkNew').value)return;await addDoc(collection(db,'ticker'),{txt:$('#tkNew').value,status:'شغال'});loadAll();};
    v.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const t=TICK.find(x=>x.id===b.dataset.id);if(b.dataset.a==='del')await deleteDoc(doc(db,'ticker',t.id));else await updateDoc(doc(db,'ticker',t.id),{status:t.status==='مخفي'?'شغال':'مخفي'});loadAll();};
  }
  else if(CUR==='stories'){v.innerHTML=`<div class="panel"><h2>🗣️ القصص</h2><div class="fld"><input id="stName" placeholder="الاسم"></div><div class="fld"><textarea id="stTxt" placeholder="نص القصة"></textarea></div><button class="save" id="stAdd">➕ إضافة</button><div class="grid" style="margin-top:12px">`+STOR.map(t=>`<div class="item"><h3>${esc(t.name)}</h3><div class="m">${esc(t.text)}</div><div class="row"><button class="btn b-ed" data-a="tg" data-id="${t.id}">${t.status==='مخفي'?'إظهار':'إخفاء'}</button><button class="btn b-no" data-a="del" data-id="${t.id}">🗑</button></div></div>`).join('')+`</div></div>`;
    $('#stAdd').onclick=async()=>{if(!$('#stTxt').value)return;await addDoc(collection(db,'stories'),{name:$('#stName').value,text:$('#stTxt').value,status:'شغال'});loadAll();};
    v.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const t=STOR.find(x=>x.id===b.dataset.id);if(b.dataset.a==='del')await deleteDoc(doc(db,'stories',t.id));else await updateDoc(doc(db,'stories',t.id),{status:t.status==='مخفي'?'شغال':'مخفي'});loadAll();};
  }
  else if(CUR==='prices'){const P=S.prices||{bronze:{day:5,d7:30,d15:60,d30:100},gold:{day:10,d7:50,d15:100,d30:150},plat:{day:20,d7:100,d15:250,d30:500}};
    v.innerHTML=`<div class="panel"><h2>💎 الأسعار (بتتحدث على الموقع فورًا)</h2>`+['bronze','gold','plat'].map(k=>`<h3 style="margin:10px 0 6px">${k==='bronze'?'🥉 برونزي':k==='gold'?'👑 ذهبي':'💎 ماسي'}</h3><div class="f2"><div class="fld"><label>اليوم</label><input type="number" id="p_${k}_day" value="${P[k].day}"></div><div class="fld"><label>7 أيام</label><input type="number" id="p_${k}_d7" value="${P[k].d7}"></div><div class="fld"><label>15 يوم</label><input type="number" id="p_${k}_d15" value="${P[k].d15}"></div><div class="fld"><label>30 يوم</label><input type="number" id="p_${k}_d30" value="${P[k].d30}"></div></div>`).join('')+`<button class="save" id="pSave">💾 حفظ الأسعار</button></div>`;
    $('#pSave').onclick=async()=>{const np={};['bronze','gold','plat'].forEach(k=>{np[k]={day:+$('#p_'+k+'_day').value,d7:+$('#p_'+k+'_d7').value,d15:+$('#p_'+k+'_d15').value,d30:+$('#p_'+k+'_d30').value};});await setDoc(doc(db,'settings','site'),{...S,prices:np});alert('✅ اتحدثت الأسعار على الموقع');loadAll();};
  }
  else if(CUR==='set'){v.innerHTML=`<div class="panel"><h2>⚙️ إعدادات الموقع</h2>
    <div class="fld"><label>البادج</label><input id="sBadge" value="${esc(S.badge||'')}"></div>
    <div class="fld"><label>العنوان الأول</label><input id="sH1" value="${esc(S.h1||'')}"></div>
    <div class="fld"><label>العنوان الثاني</label><input id="sH2" value="${esc(S.h2||'')}"></div>
    <div class="fld"><label>جملة الافتتاح</label><input id="sAnn" value="${esc(S.announce||'')}"></div>
    <div class="fld"><label>كود الخصم</label><input id="sCoup" value="${esc(S.coupon||'')}"></div>
    <div class="f2"><div class="fld"><label>واتساب الإدارة</label><input id="sWa" value="${esc(S.wa||'')}"></div><div class="fld"><label>إنستاباي</label><input id="sIn" value="${esc(S.insta||'')}"></div></div>
    <div class="fld"><label>فودافون كاش</label><input id="sVo" value="${esc(S.voda||'')}"></div>
    <button class="save" id="sSave">💾 حفظ إعدادات الموقع</button>
    <h2 style="margin-top:16px">🔑 تغيير كلمة المرور</h2>
    <div class="fld"><label>كلمة مرور جديدة (6 أحرف على الأقل)</label><input id="newPass" type="password" placeholder="مثال: Daleelak@2026"></div>
    <div class="fld"><label>تأكيد كلمة المرور</label><input id="confPass" type="password"></div>
    <button class="save" id="chPass">🔑 تغيير كلمة المرور</button>
    <p style="color:var(--mut);font-size:.72rem;margin-top:8px">بعد التغيير تقدر تدخل من أي جهاز بالإيميل daleelak317@gmail.com + كلمة المرور الجديدة.</p></div>`;
    $('#sSave').onclick=async()=>{await setDoc(doc(db,'settings','site'),{...S,badge:$('#sBadge').value,h1:$('#sH1').value,h2:$('#sH2').value,announce:$('#sAnn').value,coupon:$('#sCoup').value,wa:$('#sWa').value,insta:$('#sIn').value,voda:$('#sVo').value});alert('✅ اتحدث على الموقع');loadAll();};
    $('#chPass').onclick=async()=>{const p=$('#newPass').value,c=$('#confPass').value;
      if(!p||p.length<6){alert('الباسورد 6 أحرف على الأقل');return;}
      if(p!==c){alert('التأكيد مش مطابق');return;}
      try{await updatePassword(auth.currentUser,p);alert('✅ اتغيرت كلمة المرور — دخل بيها من أي جهاز');}catch(e){alert('⚠️ '+e.message);}};
  }
  else if(CUR==='areas'){v.innerHTML=`<div class="panel"><h2>🗺️ المناطق</h2><div class="f2"><div class="fld"><input id="arGov" placeholder="المحافظة"></div><div class="fld"><input id="arArea" placeholder="المنطقة"></div></div><button class="save" id="arAdd">➕ إضافة</button><div class="grid" style="margin-top:12px">`+AREAS.map(t=>`<div class="item"><h3>${esc(t.gov)} — ${esc(t.area)}</h3><div class="row"><button class="btn b-no" data-a="del" data-id="${t.id}">🗑</button></div></div>`).join('')+`</div></div>`;
    $('#arAdd').onclick=async()=>{if(!$('#arGov').value||!$('#arArea').value)return;await addDoc(collection(db,'areas'),{gov:$('#arGov').value,area:$('#arArea').value});loadAll();};
    v.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;await deleteDoc(doc(db,'areas',b.dataset.id));loadAll();};
  }
  }catch(e){showErr(e);}
}
</script>
</body>
</html>
